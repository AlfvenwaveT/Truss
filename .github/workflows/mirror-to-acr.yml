# Copy the Terminal-Bench 2.1 task images listed in acr-mirror/images.txt from Docker Hub to Alibaba Cloud
# Container Registry (ACR), registry to registry with skopeo. Digests are preserved, so each copy is
# byte-for-byte the Docker Hub image. Images already in ACR are skipped, so a rerun only copies
# what is missing or failed.
#
# Repository settings needed (Settings > Secrets and variables > Actions):
#   Variables: ACR_REGISTRY   the address in the 访问凭证 page's docker login command, e.g.
#                             crpi-xxxx.cn-hangzhou.personal.cr.aliyuncs.com (public endpoint)
#              ACR_NAMESPACE  your ACR namespace
#              ACR_REPOSITORY optional: one repository for all images, tagged <task>-<tag>
#                             (e.g. truss:fix-git-20260403); unset = one repository per image
#   Secrets:   ACR_USERNAME   the login name shown on the 访问凭证 page
#              ACR_PASSWORD   the fixed password set on that page
#   Optional:  DOCKERHUB_USERNAME (variable) and DOCKERHUB_TOKEN (secret), to pull from Docker Hub
#              as a logged-in user instead of anonymously (anonymous pulls are rate limited)
name: mirror-tb21-to-acr

on:
  # A change to the list on main starts a full run; a manual run can be limited with `only`.
  push:
    branches: [main]
    paths: [acr-mirror/images.txt]
  workflow_dispatch:
    inputs:
      only:
        description: "Copy only images whose reference contains this text (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  mirror:
    # Eight jobs in parallel, each copying its share of the list. images.txt is ordered largest image
    # first and dealt out in a snake order (0..7, 7..0, ...), which keeps the shares within about 15%
    # of each other by compressed size (round 20). A failed shard does not stop the others.
    name: mirror (shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 350  # GitHub-hosted jobs stop at 6 h; a rerun resumes from what is missing
    env:
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
      ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
      SHARDS: 8  # must equal the number of entries in matrix.shard
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7

      - name: Install skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          skopeo --version
          # skopeo keeps logins in this file; its default (/run/containers/<uid>/ when XDG_RUNTIME_DIR
          # is unset) may not be writable on a hosted runner. Set here because the runner context is
          # not available in job-level env.
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/containers-auth.json" >> "$GITHUB_ENV"

      - name: Log in to ACR (and Docker Hub if configured)
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Problems are reported as ::error:: annotations (readable on the run page and through the
          # API). Values of secrets are never printed, only whether they are set.
          fail=0
          check() {  # check NAME KIND VALUE
            if [ -z "$3" ]; then
              echo "::error title=$1 is missing::Add $1 under Settings > Secrets and variables > Actions > $2."; fail=1
            elif [[ "$3" =~ ^[[:space:]] || "$3" =~ [[:space:]]$ ]]; then
              echo "::error title=$1 has spaces::$1 starts or ends with a space or line break; paste it again without them."; fail=1
            fi
          }
          check ACR_REGISTRY Variables "$ACR_REGISTRY"
          check ACR_NAMESPACE Variables "$ACR_NAMESPACE"
          check ACR_USERNAME Secrets "$ACR_USERNAME"
          check ACR_PASSWORD Secrets "$ACR_PASSWORD"
          if [[ "$ACR_REGISTRY" == *://* || "$ACR_REGISTRY" == */* ]]; then
            echo "::error title=ACR_REGISTRY format::Use only the host name, e.g. crpi-xxxx.cn-hangzhou.personal.cr.aliyuncs.com (no https://, no namespace)."; fail=1
          fi
          echo "registry=$ACR_REGISTRY namespace=$ACR_NAMESPACE repository=${ACR_REPOSITORY:-<one per image>}"
          [ "$fail" -eq 0 ] || exit 1
          if ! out=$(printf '%s' "$ACR_PASSWORD" | skopeo login --username "$ACR_USERNAME" --password-stdin "$ACR_REGISTRY" 2>&1); then
            echo "::error title=ACR login failed::${out//$'\n'/ }"
            exit 1
          fi
          echo "ACR: $out"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            if out=$(printf '%s' "$DOCKERHUB_TOKEN" | skopeo login --username "$DOCKERHUB_USERNAME" --password-stdin docker.io 2>&1); then
              echo "Docker Hub: $out"
            else  # optional: carry on anonymously
              echo "::warning title=Docker Hub login failed, pulling anonymously::${out//$'\n'/ }"
            fi
          fi

      - name: Copy images
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -u
          ok=0; skipped=0; failed=0; index=0
          printf 'source\tdestination\tdigest\tresult\n' > report.tsv
          while read -r src <&3; do   # the list comes on fd 3 so nothing in the loop can read it from stdin
            [ -z "$src" ] && continue
            case "$src" in \#*) continue ;; esac
            if [ -n "$ONLY" ] && [[ "$src" != *"$ONLY"* ]]; then continue; fi
            pos=$(( index % (2 * SHARDS) )); index=$((index + 1))
            [ "$pos" -lt "$SHARDS" ] || pos=$(( 2 * SHARDS - 1 - pos ))   # snake order
            [ "$pos" -eq "$SHARD" ] || continue
            name_tag="${src##*/}"                             # docker.io/alexgshaw/fix-git:20260403 -> fix-git:20260403
            if [ -n "${ACR_REPOSITORY:-}" ]; then
              dst="$ACR_REGISTRY/$ACR_NAMESPACE/$ACR_REPOSITORY:${name_tag/:/-}"   # <registry>/<ns>/<repo>:fix-git-20260403
            else
              dst="$ACR_REGISTRY/$ACR_NAMESPACE/$name_tag"                         # <registry>/<ns>/fix-git:20260403
            fi
            # A manifest is pushed last, so one that exists in ACR belongs to a complete copy. The tags
            # are dated and not reused upstream, so an existing copy is not fetched again; this keeps
            # reruns from spending Docker Hub pulls.
            have=$(skopeo inspect --raw "docker://$dst" 2>/dev/null | sha256sum | cut -d' ' -f1)
            if [ "$have" != "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" ]; then
              echo "skip  $src (already in ACR)"; skipped=$((skipped+1))
              printf '%s\t%s\tsha256:%s\tskipped\n' "$src" "$dst" "$have" >> report.tsv; continue
            fi
            echo "copy  $src -> $dst"
            # --preserve-digests: fail rather than store a copy whose digest differs from the source
            if skopeo copy --all --preserve-digests --retry-times 3 --digestfile digest.txt "docker://$src" "docker://$dst"; then
              ok=$((ok+1)); printf '%s\t%s\t%s\tcopied\n' "$src" "$dst" "$(cat digest.txt)" >> report.tsv
            else
              echo "::error::copy failed for $src"; failed=$((failed+1)); printf '%s\t%s\t\tcopy failed\n' "$src" "$dst" >> report.tsv
            fi
          done 3< acr-mirror/images.txt
          echo "shard $SHARD: copied $ok, skipped $skipped, failed $failed" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mirror-report-${{ matrix.shard }}
          path: report.tsv
